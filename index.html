<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") === "light" ? "light" : "dark";
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">☀ Claro</button>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="menu-btn" type="button">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
      <div class="overlay-box menu-box">
        <div id="pause-view-main" class="menu-view">
          <p class="menu-title">PAUSA</p>

          <div class="menu-field">
            <label class="label" for="start-level">NIVEL INICIAL</label>
            <select id="start-level"></select>
            <p class="menu-hint">Se aplica al empezar una partida nueva.</p>
          </div>

          <div class="menu-actions">
            <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
            <button id="menu-restart-btn" class="menu-btn" type="button">Reiniciar</button>
            <button id="show-controls-btn" class="menu-btn menu-btn-secondary" type="button">Ver controles</button>
          </div>
        </div>

        <div id="pause-view-controls" class="menu-view hidden">
          <p class="menu-title">CONTROLES</p>

          <ul class="menu-controls">
            <li><kbd>←</kbd><kbd>→</kbd> Mover la pieza</li>
            <li><kbd>↑</kbd><kbd>X</kbd> Rotar</li>
            <li><kbd>↓</kbd> Bajar más rápido</li>
            <li><kbd>Espacio</kbd> Caída instantánea</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> Pausa / reanudar</li>
          </ul>

          <button id="controls-back-btn" class="menu-btn menu-btn-secondary" type="button">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
